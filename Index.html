<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#900C3F">
<title>ARBA - Xizmat daftari</title>
<style>
:root{--primary:#900C3F;--primary-dark:#6B0A30;--primary-light:#C9184A;--bg:#F8F9FA;--card:#FFFFFF;--text:#1A1A1A;--text-light:#6B7280;--border:#E5E7EB;--success:#10B981;--danger:#EF4444;--warning:#F59E0B;--shadow:0 1px 3px rgba(0,0,0,.08),0 1px 2px rgba(0,0,0,.04);--shadow-lg:0 10px 25px rgba(0,0,0,.1),0 4px 6px rgba(0,0,0,.05)}
*{margin:0;padding:0;box-sizing:border-box}
html,body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased;overscroll-behavior:none;min-height:100vh}
#app{min-height:100vh;display:flex;flex-direction:column}
button{font-family:inherit;cursor:pointer;border:none;background:none}
input,select,textarea{font-family:inherit}
.login-screen{min-height:100vh;background:linear-gradient(135deg,var(--primary) 0%,var(--primary-dark) 100%);display:flex;align-items:center;justify-content:center;padding:24px}
.login-card{background:#fff;border-radius:24px;padding:36px 28px;width:100%;max-width:380px;box-shadow:var(--shadow-lg);text-align:center}
.login-logo{width:140px;height:140px;margin:0 auto 16px;display:block}
.login-title{font-size:22px;font-weight:800;color:var(--primary);margin-bottom:4px}
.login-subtitle{font-size:13px;color:var(--text-light);margin-bottom:28px}
.login-form{display:flex;flex-direction:column;gap:14px;text-align:left}
.login-form label{font-size:12px;font-weight:600;color:var(--text-light);text-transform:uppercase;letter-spacing:.5px}
.login-form input{width:100%;padding:14px 16px;border:2px solid var(--border);border-radius:12px;font-size:15px;background:#FAFAFA;transition:all .2s}
.login-form input:focus{outline:none;border-color:var(--primary);background:#fff}
.login-btn{background:var(--primary);color:#fff;padding:14px;border-radius:12px;font-weight:700;font-size:15px;margin-top:8px}
.login-btn:hover{background:var(--primary-dark)}
.login-btn:disabled{opacity:.5;cursor:not-allowed}
.login-hint{font-size:11px;color:var(--text-light);margin-top:16px;padding:10px;background:#FFF7ED;border-radius:8px;border-left:3px solid var(--warning);text-align:left}
.login-error{color:var(--danger);font-size:13px;margin-top:8px;padding:8px;background:#FEF2F2;border-radius:8px}
.app-header{background:var(--primary);color:#fff;padding:14px 16px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;box-shadow:var(--shadow)}
.header-left{display:flex;align-items:center;gap:10px}
.header-logo{width:36px;height:36px;background:#fff;border-radius:50%;padding:4px;display:flex;align-items:center;justify-content:center}
.header-logo svg{width:100%;height:100%}
.header-title{font-size:16px;font-weight:700}
.header-right{display:flex;align-items:center;gap:8px}
.role-badge{background:rgba(255,255,255,.2);color:#fff;padding:4px 10px;border-radius:12px;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.5px}
.btn-icon{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;transition:background .2s}
.btn-icon:hover{background:rgba(255,255,255,.15)}
.main-content{flex:1;padding:14px;max-width:800px;margin:0 auto;width:100%}
.stats-grid{display:grid;grid-template-columns:1fr 2fr;gap:10px;margin-bottom:14px}
.stat-card{background:var(--card);padding:14px;border-radius:12px;box-shadow:var(--shadow)}
.stat-label{font-size:10px;color:var(--text-light);font-weight:700;text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px}
.stat-value{font-size:22px;font-weight:800;color:var(--text)}
.stat-value.accent{color:var(--primary);font-size:18px;word-break:break-word}
.search-box{position:relative;margin-bottom:14px}
.search-box input{width:100%;padding:12px 14px 12px 42px;border:1px solid var(--border);border-radius:12px;font-size:14px;background:var(--card);box-shadow:var(--shadow)}
.search-box input:focus{outline:none;border-color:var(--primary)}
.search-box svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--text-light)}
.driver-card{background:var(--card);border-radius:12px;padding:12px;margin-bottom:10px;box-shadow:var(--shadow);display:flex;align-items:center;gap:12px;cursor:pointer;transition:transform .15s,box-shadow .15s}
.driver-card:active{transform:scale(.98)}
.driver-avatar{width:48px;height:48px;border-radius:50%;background:var(--primary);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:18px;flex-shrink:0;overflow:hidden}
.driver-avatar img{width:100%;height:100%;object-fit:cover}
.driver-info{flex:1;min-width:0}
.driver-name{font-weight:700;font-size:15px;margin-bottom:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.driver-car{font-size:13px;color:var(--text-light);margin-bottom:4px}
.driver-plate-tag{display:inline-block;background:var(--primary);color:#fff;padding:2px 8px;border-radius:4px;font-size:11px;font-weight:700}
.driver-stats{text-align:right;flex-shrink:0}
.driver-stats .amount{color:var(--primary);font-weight:800;font-size:14px}
.driver-actions{display:flex;gap:4px;margin-left:6px;flex-shrink:0}
.action-btn{width:32px;height:32px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:16px;transition:background .2s}
.action-btn.edit{color:#3B82F6;background:#EFF6FF}
.action-btn.edit:hover{background:#DBEAFE}
.action-btn.delete{color:var(--danger);background:#FEF2F2}
.action-btn.delete:hover{background:#FEE2E2}
.btn-primary{background:var(--primary);color:#fff;padding:12px;border-radius:10px;font-weight:700;font-size:14px}
.btn-primary:hover{background:var(--primary-dark)}
.btn-secondary{background:var(--card);color:var(--text);padding:12px;border-radius:10px;font-weight:600;border:1px solid var(--border)}
.btn-danger{background:var(--danger);color:#fff;padding:12px;border-radius:10px;font-weight:700}
.btn-outline{background:transparent;color:var(--primary);border:1.5px solid var(--primary);padding:12px;border-radius:10px;font-weight:700;width:100%;display:flex;align-items:center;justify-content:center;gap:8px}
.btn-outline:hover{background:var(--primary);color:#fff}
.add-driver-btn{width:100%;margin-top:14px}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;padding:16px;z-index:2000;animation:fadeIn .2s}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.modal{background:#fff;border-radius:16px;width:100%;max-width:480px;max-height:90vh;display:flex;flex-direction:column;overflow:hidden;animation:slideUp .25s}
@keyframes slideUp{from{transform:translateY(20px);opacity:0}to{transform:translateY(0);opacity:1}}
.modal-header{padding:16px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
.modal-title{font-size:17px;font-weight:700}
.modal-close{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--text-light)}
.modal-close:hover{background:var(--bg)}
.modal-body{padding:16px;overflow-y:auto;flex:1}
.modal-footer{padding:14px;border-top:1px solid var(--border);display:flex;gap:10px}
.modal-footer button{flex:1}
.form-group{margin-bottom:12px}
.form-group label{display:block;font-size:12px;font-weight:600;color:var(--text-light);margin-bottom:6px;text-transform:uppercase;letter-spacing:.5px}
.form-group input,.form-group select,.form-group textarea{width:100%;padding:11px 12px;border:1px solid var(--border);border-radius:8px;font-size:14px;background:#FAFAFA}
.form-group input:focus,.form-group select:focus,.form-group textarea:focus{outline:none;border-color:var(--primary);background:#fff}
.form-group textarea{min-height:70px;resize:vertical}
.date-input{display:flex;align-items:center;justify-content:space-between;padding:11px 12px;border:1px solid var(--border);border-radius:8px;background:#FAFAFA;cursor:pointer;font-size:14px}
.date-input:hover{background:#fff}
.date-input input{border:none;background:transparent;padding:0;cursor:pointer;font-size:14px;color:var(--text)}
.avatar-upload{display:flex;align-items:center;gap:14px}
.avatar-preview{width:80px;height:80px;border-radius:50%;background:linear-gradient(135deg,#FFF1F2 0%,#FFE4E6 100%);border:2px dashed var(--primary);display:flex;align-items:center;justify-content:center;font-size:30px;font-weight:800;color:var(--primary);overflow:hidden;flex-shrink:0}
.avatar-preview img{width:100%;height:100%;object-fit:cover}
.upload-controls{flex:1;display:flex;flex-direction:column;gap:8px}
.file-label{padding:10px 12px;border:1px solid var(--border);border-radius:8px;background:#fff;font-weight:600;text-align:center;cursor:pointer;font-size:13px;display:block}
.file-label:hover{background:var(--bg);border-color:var(--primary);color:var(--primary)}
#f-photo-clear{padding:8px 12px;font-size:13px;background:#FEF2F2;color:var(--danger);border:1px solid #FEE2E2;border-radius:8px;font-weight:600}
.detail-screen{padding:14px;max-width:800px;margin:0 auto;width:100%}
.detail-profile{background:var(--card);padding:14px;border-radius:12px;display:flex;gap:12px;margin-bottom:14px;box-shadow:var(--shadow)}
.profile-avatar{width:60px;height:60px;border-radius:50%;background:var(--primary);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:22px;flex-shrink:0;overflow:hidden}
.profile-avatar img{width:100%;height:100%;object-fit:cover}
.profile-info{flex:1}
.profile-name{font-weight:700;font-size:16px;margin-bottom:6px}
.profile-line{font-size:13px;margin-bottom:4px}
.profile-line .label{color:var(--text-light)}
.profile-line .value{font-weight:600}
.profile-line .plate-tag{background:var(--primary);color:#fff;padding:2px 8px;border-radius:4px;font-size:11px;font-weight:700;margin-left:6px}
.month-picker{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:12px;margin-bottom:12px;text-align:center}
.month-picker .label{font-size:11px;color:var(--text-light);font-weight:700;text-transform:uppercase;letter-spacing:1px;margin-bottom:6px}
.month-nav{display:flex;align-items:center;justify-content:space-between}
.month-nav button{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--primary)}
.month-nav button:hover{background:#FEF2F2}
.month-name{font-size:17px;font-weight:700}
.month-total{background:linear-gradient(135deg,#FFF1F2 0%,#FFE4E6 100%);border:1px solid #FECDD3;border-radius:12px;padding:16px;text-align:center;margin-bottom:16px}
.month-total .label{color:var(--text-light);font-size:13px;margin-bottom:4px}
.month-total .amount{color:var(--primary);font-size:24px;font-weight:800}
.section-title{font-weight:700;font-size:15px;margin-bottom:10px;display:flex;align-items:center;justify-content:space-between}
.category-card{background:var(--card);border-radius:10px;padding:12px 14px;margin-bottom:8px;box-shadow:var(--shadow);display:flex;align-items:center;justify-content:space-between}
.category-card .left{display:flex;align-items:center;gap:10px}
.category-icon{width:36px;height:36px;border-radius:50%;background:#FFF1F2;display:flex;align-items:center;justify-content:center;color:var(--primary)}
.category-name{font-size:14px;font-weight:600}
.category-amount{font-weight:700;font-size:14px}
.log-card{background:var(--card);border-radius:10px;padding:12px;margin-bottom:8px;box-shadow:var(--shadow);display:flex;align-items:center;gap:10px}
.log-content{flex:1;min-width:0}
.log-desc{font-weight:600;font-size:14px;margin-bottom:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.log-meta{font-size:11px;color:var(--text-light)}
.log-amount{color:var(--success);font-weight:700;font-size:14px}
.log-delete{width:28px;height:28px;border-radius:6px;color:var(--danger);background:#FEF2F2;display:flex;align-items:center;justify-content:center;font-size:14px}
.log-delete:hover{background:#FEE2E2}
.empty-state{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:32px;text-align:center;color:var(--text-light);font-weight:600}
.back-btn{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff}
.back-btn:hover{background:rgba(255,255,255,.15)}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--text);color:#fff;padding:12px 20px;border-radius:10px;font-size:14px;font-weight:500;z-index:3000;box-shadow:var(--shadow-lg);animation:toastIn .3s}
@keyframes toastIn{from{transform:translate(-50%,20px);opacity:0}to{transform:translate(-50%,0);opacity:1}}
.toast.error{background:var(--danger)}
.toast.success{background:var(--success)}
.readonly-banner{background:linear-gradient(135deg,#FEF3C7 0%,#FDE68A 100%);border-left:4px solid var(--warning);padding:10px 14px;border-radius:8px;font-size:13px;font-weight:600;margin-bottom:12px;display:flex;align-items:center;gap:8px;color:#92400E}
.install-banner{position:fixed;bottom:16px;left:16px;right:16px;background:#fff;padding:14px;border-radius:12px;box-shadow:var(--shadow-lg);display:flex;align-items:center;gap:12px;z-index:1500;border-left:4px solid var(--primary)}
.install-banner .text{flex:1;font-size:13px}
.install-banner .text strong{color:var(--primary);display:block;margin-bottom:2px}
.install-banner button{padding:8px 12px;border-radius:8px;font-weight:600;font-size:13px}
@media(max-width:380px){.stats-grid{grid-template-columns:1fr}.stat-value{font-size:20px}.driver-stats .amount{font-size:12px}}
</style>
</head>
<body>
<div id="app"></div>
<div id="install-banner" style="display:none" class="install-banner">
  <div class="text"><strong>ARBA ilovasini o'rnatish</strong>Telefoningizga ilova sifatida o'rnating</div>
  <button id="install-btn" style="background:#900C3F;color:#fff">O'rnatish</button>
  <button id="install-cancel" style="background:#F3F4F6;color:#6B7280">Yo'q</button>
</div>
<script>
const PASSWORD_ADMIN='ARBA170',PASSWORD_CLIENT='arba';
const STORAGE_KEY='arba_data_v1',AUTH_KEY='arba_auth_v1';
const CATEGORIES=[
  {id:'moy',title:"Moy almashtrish",icon:'drop'},
  {id:'balon',title:"Balon almashtrish",icon:'circle'},
  {id:'mator',title:"Mator harjatlari",icon:'cog'},
  {id:'hadavoy',title:"Hadavoy harjatlari",icon:'steering'},
  {id:'elektrik',title:"Elektrik harajatlari",icon:'bolt'},
  {id:'boshqa',title:"Boshqa",icon:'tag'}
];
const MONTHS=["Yanvar","Fevral","Mart","Aprel","May","Iyun","Iyul","Avgust","Sentyabr","Oktyabr","Noyabr","Dekabr"];
const VALID_CATEGORY_IDS=['moy','balon','mator','hadavoy','elektrik','boshqa'];
function svgIcon(type,size){
  const s=size||20;
  const svgs={
    drop:'<path d="M12 2C8 8 5 11 5 15a7 7 0 0 0 14 0c0-4-3-7-7-13z" fill="currentColor"/>',
    circle:'<circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2"/>',
    cog:'<circle cx="12" cy="12" r="3" fill="none" stroke="currentColor" stroke-width="2"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9c.36.15.68.4.93.7" fill="none" stroke="currentColor" stroke-width="2"/>',
    bolt:'<path d="M13 2L3 14h7l-1 8 10-12h-7z" fill="currentColor"/>',
    tag:'<path d="M20.59 13.41l-7.17 7.17a2 2 0 0 1-2.83 0L2 12V2h10l8.59 8.59a2 2 0 0 1 0 2.82z" fill="none" stroke="currentColor" stroke-width="2"/><line x1="7" y1="7" x2="7.01" y2="7" stroke="currentColor" stroke-width="2"/>',
    steering:'<circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="12" cy="12" r="2.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 14.5L8.5 18M12 14.5L15.5 18M12 9.5V5" fill="none" stroke="currentColor" stroke-width="2"/>'
  };
  return '<svg width="'+s+'" height="'+s+'" viewBox="0 0 24 24">'+svgs[type]+'</svg>';
}

function getLogoSVG(size){
  size=size||100;
  return '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="'+size+'" height="'+size+'"><rect width="200" height="200" fill="#900C3F"/><circle cx="100" cy="78" r="48" fill="#FFFFFF"/><path fill="#900C3F" d="M65 60 c3-2 7-3 11-1 c-1-5 3-10 8-9 c3 1 5 3 5 6 c4-1 9 0 10 4 c1 4-1 8-5 9 c2 2 2 6 0 8 c-2 2-7 1-9-1 c0 6-5 11-11 11 c-3 0-5-1-7-3 c0 4-2 7-5 7 c-3 0-5-2-5-5 c-2 1-5-1-5-4 c0-3 3-5 6-4 c1-5 5-10 8-16 z M70 78 a2.5 2.5 0 1 0 5 0 a2.5 2.5 0 1 0 -5 0"/><text x="100" y="172" font-family="Arial Black, Helvetica, sans-serif" font-size="36" font-weight="900" text-anchor="middle" fill="#FFFFFF" letter-spacing="3">ARBA</text></svg>';
}

let state={drivers:[],auth:null};

function migrateLog(log){
  if(!log||!VALID_CATEGORY_IDS.includes(log.category))log.category='boshqa';
  if(!log.date)log.date=todayISO();
  if(typeof log.cost!=='number'||isNaN(log.cost))log.cost=0;
  return log;
}

function loadData(){
  try{
    const raw=localStorage.getItem(STORAGE_KEY);
    if(raw){
      state.drivers=JSON.parse(raw);
      state.drivers.forEach(d=>{
        if(!Array.isArray(d.logs))d.logs=[];
        d.logs.forEach(migrateLog);
      });
    }else{
      state.drivers=[
        {id:1,name:"Aziz Karimov",car:"Chevrolet Cobalt",plate:"01 A 123 BC",inventory:"Havo filtri, moy filtri, domkrat",imageUrl:null,logs:[{id:1,description:"Moy almashtirildi",cost:2273500,category:'moy',date:'2026-10-15'}]},
        {id:2,name:"Sardor Yusupov",car:"Chevrolet Malibu 2",plate:"01 B 456 DE",inventory:"Aptekacha, o't o'chirgich",imageUrl:null,logs:[{id:2,description:"Balon almashtirildi",cost:550000,category:'balon',date:'2026-10-10'}]}
      ];
      saveData();
    }
    const authRaw=sessionStorage.getItem(AUTH_KEY);
    if(authRaw)state.auth=JSON.parse(authRaw);
  }catch(e){console.error(e);state.drivers=[]}
}
function saveData(){try{localStorage.setItem(STORAGE_KEY,JSON.stringify(state.drivers))}catch(e){alert("Saqlashda xato: "+e.message)}}
function saveAuth(){if(state.auth)sessionStorage.setItem(AUTH_KEY,JSON.stringify(state.auth));else sessionStorage.removeItem(AUTH_KEY)}
function isAdmin(){return state.auth==='admin'}

function formatMoney(amount){const s=Math.round(amount).toString();return s.replace(/\B(?=(\d{3})+(?!\d))/g,' ')+" so'm"}
function uid(){return Date.now()+Math.floor(Math.random()*1000)}
function getInitial(name){return name&&name.length?name[0].toUpperCase():'H'}
function getCategoryById(id){return CATEGORIES.find(c=>c.id===id)||CATEGORIES[0]}
function todayISO(){const d=new Date();return d.toISOString().slice(0,10)}
function formatDate(d){const[y,m,day]=d.split('-');return parseInt(day)+'.'+parseInt(m)+'.'+y}

const routes={'#/login':renderLogin,'#/':renderList,'#/driver':renderDetail};
function navigate(hash){window.location.hash=hash}
function onRoute(){
  const hash=window.location.hash||'#/';
  if(!state.auth&&hash!=='#/login'){navigate('#/login');return}
  const r=render=(routes[hash.split('?')[0]]||renderList);
  r();
}
window.addEventListener('hashchange',onRoute);

let toastTimer=null;
function toast(msg,type){
  const el=document.createElement('div');
  el.className='toast '+(type||'');
  el.textContent=msg;
  document.body.appendChild(el);
  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>el.remove(),2500);
}

function render(){
  const app=document.getElementById('app');
  if(!state.auth){
    app.innerHTML=getLoginHTML();
    bindLogin();
  }else if(window.location.hash.startsWith('#/driver')){
    const params=new URLSearchParams(window.location.hash.split('?')[1]||'');
    const id=parseInt(params.get('id'));
    const driver=state.drivers.find(d=>d.id===id);
    if(!driver){navigate('#/');return}
    app.innerHTML=getDetailHTML(driver);
    bindDetail(driver);
  }else{
    app.innerHTML=getListHTML();
    bindList();
  }
}

function escapeHTML(str){
  if(str==null)return'';
  return String(str).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]);
}

function renderDriverCards(filter){
  if(filter===undefined)filter='';
  const now=new Date();
  const q=filter.toLowerCase();
  const list=state.drivers.filter(d=>d.name.toLowerCase().includes(q)||d.car.toLowerCase().includes(q)||d.plate.toLowerCase().includes(q));
  const admin=isAdmin();
  if(list.length===0)return '<div class="empty-state">'+(filter?'Hech narsa topilmadi':"Haydovchilar yo\'q. Qo\'shish uchun tugmani bosing.")+'</div>';
  return list.map(d=>{
    const monthLogs=(d.logs||[]).filter(l=>{const dt=new Date(l.date);return dt.getFullYear()===now.getFullYear()&&dt.getMonth()===now.getMonth()});
    const monthTotal=monthLogs.reduce((s,l)=>s+l.cost,0);
    return '<div class="driver-card" data-id="'+d.id+'">'
      +'<div class="driver-avatar">'+avatarHTML(d,48)+'</div>'
      +'<div class="driver-info"><div class="driver-name">'+escapeHTML(d.name)+'</div>'
      +'<div class="driver-car">'+escapeHTML(d.car)+'</div>'
      +'<span class="driver-plate-tag">'+escapeHTML(d.plate)+'</span></div>'
      +'<div class="driver-stats"><div class="amount">'+formatMoney(monthTotal)+'</div></div>'
      +(admin?'<div class="driver-actions"><button class="action-btn edit" data-action="edit" data-id="'+d.id+'" title="Tahrirlash"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg></button><button class="action-btn delete" data-action="delete" data-id="'+d.id+'" title="O\'chirish"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg></button></div>':'')
      +'</div>';
  }).join('');
}

function bindList(){
  const search=document.getElementById('search');
  const listEl=document.getElementById('driver-list');
  listEl.innerHTML=renderDriverCards('');
  if(search)search.addEventListener('input',e=>{listEl.innerHTML=renderDriverCards(e.target.value)});
  document.getElementById('logout-btn').addEventListener('click',()=>{state.auth=null;saveAuth();navigate('#/login')});
  if(isAdmin()){
    const addBtn=document.getElementById('add-driver');
    if(addBtn)addBtn.addEventListener('click',()=>openDriverDialog());
    listEl.addEventListener('click',e=>{
      const btn=e.target.closest('[data-action]');
      if(btn){
        e.stopPropagation();
        const id=parseInt(btn.dataset.id);
        const drv=state.drivers.find(d=>d.id===id);
        if(!drv)return;
        if(btn.dataset.action==='edit')openDriverDialog(drv);

    listEl.addEventListener('click',e=>{const card=e.target.closest('.driver-card');if(card)navigate('#/driver?id='+card.dataset.id)});
  }
}

function openDriverDialog(driver){
  const isEdit=!!driver;
  let currentImageUrl=driver?driver.imageUrl:null;
  const initial=driver?getInitial(driver.name):'+';
  const hasImg=!!(driver&&driver.imageUrl);
  showModal({
    title:isEdit?'Haydovchini tahrirlash':"Yangi haydovchi qo'shish",
    bodyHTML:'<div class="form-group"><label>F.I.O</label><input id="f-name" value="'+escapeHTML(driver?driver.name:'')+'" placeholder="Masalan: Aziz Karimov"></div>'
      +'<div class="form-group"><label>Avtomobil</label><input id="f-car" value="'+escapeHTML(driver?driver.car:'')+'" placeholder="Masalan: Chevrolet Cobalt"></div>'
      +'<div class="form-group"><label>Davlat raqami</label><input id="f-plate" value="'+escapeHTML(driver?driver.plate:'')+'" placeholder="Masalan: 01 A 777 AA"></div>'
      +'<div class="form-group"><label>Jihozlar</label><input id="f-inv" value="'+escapeHTML(driver?driver.inventory:'')+'" placeholder="Domkrat, aptekacha..."></div>'
      +'<div class="form-group"><label>Haydovchi rasmi</label><div class="avatar-upload"><div class="avatar-preview" id="f-preview">'+(hasImg?'<img src="'+driver.imageUrl+'">':'<span>'+initial+'</span>')+'</div><div class="upload-controls"><label class="file-label" for="f-photo">📷 Rasm tanlash</label><input type="file" id="f-photo" accept="image/*" style="display:none"><button type="button" id="f-photo-clear" style="'+(hasImg?'':'display:none')+'">O\'chirish</button></div></div></div>',
    confirmText:isEdit?'Saqlash':"Qo'shish",
    onMount:()=>{
      const fileInput=document.getElementById('f-photo');
      const previewEl=document.getElementById('f-preview');
      const clearBtn=document.getElementById('f-photo-clear');
      fileInput.addEventListener('change',e=>{
        const file=e.target.files[0];
        if(!file)return;
        if(file.size>5*1024*1024){toast("Rasm 5 MB dan kichik bo'lishi kerak",'error');fileInput.value='';return}
        const reader=new FileReader();
        reader.onload=ev=>{
          const img=new Image();
          img.onload=()=>{
            try{
              const canvas=document.createElement('canvas');
              const MAX=400;let w=img.width,h=img.height;
              if(w>h){if(w>MAX){h=Math.round(h*MAX/w);w=MAX}}
              else{if(h>MAX){w=Math.round(w*MAX/h);h=MAX}}
              canvas.width=w;canvas.height=h;
              canvas.getContext('2d').drawImage(img,0,0,w,h);
              currentImageUrl=canvas.toDataURL('image/jpeg',0.7);
              previewEl.innerHTML='<img src="'+currentImageUrl+'">';
              clearBtn.style.display='';
            }catch(e){toast("Rasmni siqishda xato: "+e.message,'error')}
          };
          img.onerror=()=>toast("Rasmni o'qib bo'lmadi",'error');
          img.src=ev.target.result;
        };
        reader.readAsDataURL(file);
      });
      clearBtn.addEventListener('click',()=>{currentImageUrl=null;previewEl.innerHTML='<span>'+initial+'</span>';clearBtn.style.display='none';fileInput.value=''});
    },
    onConfirm:()=>{
      const name=document.getElementById('f-name').value.trim();
      const car=document.getElementById('f-car').value.trim();
      const plate=document.getElementById('f-plate').value.trim();
      const inventory=document.getElementById('f-inv').value.trim();
      if(!name||!car){toast("Ism va avtomobil kiritilishi shart",'error');return false}
      if(isEdit){Object.assign(driver,{name,car,plate,inventory,imageUrl:currentImageUrl});toast("Saqlandi",'success')}
      else{state.drivers.push({id:uid(),name,car,plate,inventory,imageUrl:currentImageUrl,logs:[]});toast("Haydovchi qo'shildi",'success')}
      saveData();render();return true;
    }
  });
}

function confirmDeleteDriver(driver){
  showModal({title:"Haydovchini o'chirish",bodyHTML:'<p><strong>'+escapeHTML(driver.name)+'</strong> va uning barcha ma\'lumotlarini o\'chirmoqchimisiz?</p>',confirmText:"O'chirish",danger:true,onConfirm:()=>{state.drivers=state.drivers.filter(d=>d.id!==driver.id);saveData();toast("O'chirildi",'success');render();return true}});

function bindDetail(driver){
  document.getElementById('back-btn').addEventListener('click',()=>navigate('#/'));

  const urlHash=window.location.hash;
  const qp=new URLSearchParams(urlHash.split('?')[1]||'');
  const y=parseInt(qp.get('y'))||new Date().getFullYear();
  const m=parseInt(qp.get('m'))||new Date().getMonth()+1;
  document.getElementById('prev-month').addEventListener('click',()=>{let ny=y,nm=m-1;if(nm<1){nm=12;ny--}navigate('#/driver?id='+driver.id+'&y='+ny+'&m='+nm)});
  document.getElementById('next-month').addEventListener('click',()=>{let ny=y,nm=m+1;if(nm>12){nm=1;ny++}navigate('#/driver?id='+driver.id+'&y='+ny+'&m='+nm)});
  const monthDropdown=document.getElementById('month-dropdown');
  if(monthDropdown)monthDropdown.addEventListener('change',e=>{const[ny,nm]=e.target.value.split('-').map(Number);navigate('#/driver?id='+driver.id+'&y='+ny+'&m='+nm)});
  if(isAdmin()){
    document.getElementById('add-log').addEventListener('click',()=>openLogDialog(driver,y,m));

        navigate('#/driver?id='+driver.id+'&y='+y+'&m='+m);

function openLogDialog(driver,y,m){
  showModal({
    title:"Yangi xarajat qo'shish",
    bodyHTML:'<div class="form-group"><label>Xarajat bo\'limi</label>'
      +'<select id="f-cat" required>'+CATEGORIES.map(c=>'<option value="'+c.id+'">'+c.title+'</option>').join('')+'</select></div>'
      +'<div class="form-group"><label>Xizmat tavsifi / Izoh</label><textarea id="f-desc" placeholder="Izoh kiriting..."></textarea></div>'
      +'<div class="form-group"><label>Summa (so\'m)</label><input id="f-cost" type="number" inputmode="decimal" placeholder="0"></div>'
      +'<div class="form-group"><label>Sana</label><div class="date-input"><input type="date" id="f-date" value="'+todayISO()+'"></div></div>',
    confirmText:'Saqlash',
    onConfirm:()=>{
      const category=document.getElementById('f-cat').value;
      const description=document.getElementById('f-desc').value.trim();
      const cost=parseFloat(document.getElementById('f-cost').value)||0;
      const date=document.getElementById('f-date').value||todayISO();
      if(!VALID_CATEGORY_IDS.includes(category)){toast("Bo'limni tanlash shart",'error');return false}
      if(!description||cost<=0){toast("Izoh va summa kiritilishi shart",'error');return false}
      driver.logs.push({id:uid(),description,cost,category,date});
      saveData();toast("Xarajat qo'shildi",'success');
      navigate('#/driver?id='+driver.id+'&y='+y+'&m='+m);return true;
    }
  });
}

function showModal(opts){
  const{title,bodyHTML,confirmText='OK',cancelText='Bekor',danger=false,onConfirm,onMount}=opts;
  const overlay=document.createElement('div');
  overlay.className='modal-overlay';
  overlay.innerHTML='<div class="modal"><div class="modal-header"><div class="modal-title">'+title+'</div><button class="modal-close" id="m-close"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button></div><div class="modal-body">'+bodyHTML+'</div><div class="modal-footer"><button class="btn-secondary" id="m-cancel">'+cancelText+'</button><button class="'+(danger?'btn-danger':'btn-primary')+'" id="m-confirm">'+confirmText+'</button></div></div>';
  document.body.appendChild(overlay);
  const close=()=>overlay.remove();
  overlay.addEventListener('click',e=>{if(e.target===overlay)close()});
  document.getElementById('m-close').addEventListener('click',close);
  document.getElementById('m-cancel').addEventListener('click',close);
  document.getElementById('m-confirm').addEventListener('click',()=>{const ok=onConfirm&&onConfirm();if(ok!==false)close()});
  if(typeof onMount==='function')onMount();
}
